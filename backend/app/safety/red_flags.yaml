# Danh sách cờ đỏ CHỈ ĐỂ HỌC, không thay thế quy trình y tế thật. Viết có dấu; code tự chuẩn hóa.
#
# Mỗi luật:
#   phrases: so trên chữ đã bỏ dấu, nên gõ không dấu vẫn bắt được.
#   exact: cụm mà bỏ dấu sẽ trùng câu vô hại ("tự tử"/"từ từ", "ngất"/"ngạt mũi", "xỉu"/"xíu", "nói khó"/"nỗi khổ"),
#     nên phải gõ đúng dấu mới bắt. Gõ không dấu thì để lớp 2 (check_symptoms) bắt.
#   except: cụm vô hại viết có dấu; cụm khớp mà chồng lên cụm này thì bỏ ("nâng ngực" không phải "nặng ngực").
#   not_after: từ viết có dấu; có trong 3 từ ngay trước cụm khớp (cùng vế câu) thì bỏ ("sợ lấy máu muốn chết"),
#     trừ khi khoảng đó cũng có một từ still_if ("mệt mỏi chỉ muốn chết" vẫn báo).
#   all_of: các nhóm (mỗi nhóm có phrases / exact / except) cùng có mặt trong một tin nhắn thì báo.
#
# Từ chức năng dưới đây: tin nhắn có dấu thì so có dấu ("ợ chua" không phải "chưa"), không dấu thì so bỏ dấu.
# Phủ định: bỏ qua triệu chứng nếu ngay trước nó, cách tối đa 2 từ và trong cùng vế câu, có một cụm phủ định.
negations: [không, chưa, chưa từng, không hề, hết, không còn, chưa bao giờ, không bao giờ, không có, không thấy]
# Chỉ dùng khi tin nhắn có dấu: bỏ dấu thì "chả" thành "cha" (bố).
accented_negations: [chẳng, chả]
# Cụm bắt đầu bằng từ phủ định nhưng không phủ định triệu chứng theo sau ("hết sức khó thở").
not_negations: [hết sức, không chỉ, không những, không hiểu sao, không biết sao, chưa kể, không ngờ,
                không thấy đỡ, không đỡ, không khỏi, không giảm]
# Từ nối: phủ định đứng trước từ này không phủ định phần sau ("không đau nhưng khó thở"). Mỗi mục một từ.
connectors: [nhưng, mà, nên, thì]
# Từ liệt kê: phủ định của triệu chứng trước áp cho triệu chứng sau ("không đau ngực hay khó thở"). Mỗi mục một từ.
coordinators: [hay, hoặc, và, với]

rules:
  - id: dau_nguc
    severity: emergency
    symptom_code: dau_nguc
    phrases: [đau ngực, đau thắt ngực, tức ngực, nặng ngực, thắt ngực, ngực đau]
    except: [nâng ngực]

  - id: kho_tho
    severity: emergency
    symptom_code: kho_tho
    phrases: [khó thở, thở dốc, hụt hơi, ngạt thở, không thở được]

  - id: dot_quy
    severity: emergency
    symptom_code: dot_quy
    phrases: [yếu nửa người, liệt nửa người, tê nửa người, méo miệng, nói ngọng đột ngột, méo mồm]
    exact: [nói khó]
    except: [bạn nói khó, em nói khó]  # người dùng chê câu trả lời khó hiểu

  - id: ngat
    severity: emergency
    symptom_code: ngat
    phrases: [bất tỉnh, ngất xỉu, lịm đi]
    exact: [ngất, xỉu]
    except: [ngất ngưởng, ngất trời, ngất ngây]

  - id: co_giat
    severity: emergency
    symptom_code: co_giat
    phrases: [co giật]
    except: [có giật]  # "đo điện tim có giật không?"

  - id: xuat_huyet
    severity: emergency
    symptom_code: xuat_huyet
    phrases: [ho ra máu, nôn ra máu, đi ngoài ra máu, đi cầu ra máu, đại tiện ra máu, chảy máu không cầm, ói ra máu]

  - id: sot_cung_co
    severity: emergency
    symptom_code: sot_cung_co
    phrases: [sốt cao co giật, sốt cao kèm cứng cổ, sốt cao cứng cổ]
    # spec: sốt cao kèm cứng cổ; cứng cổ đơn lẻ (ngồi máy tính nhiều) không phải cấp cứu
    all_of:
      - {phrases: [sốt]}
      - {exact: [cứng cổ, cứng gáy]}

  - id: tu_tu
    severity: emergency
    symptom_code: tu_tu
    phrases: [tự sát, muốn chết, không muốn sống, ý định tự tử, nghĩ đến tự tử, nghĩ tới tự tử]
    exact: [tự tử]
    # nói quá: "sợ lấy máu muốn chết", "nóng muốn chết". Không gồm "buồn", "chán", "đau" vì có thể là thật.
    # shortcut: gõ không dấu thì vẫn báo cả câu nói quá; cố ý chấp nhận để an toàn
    not_after: [sợ, mệt, đói, khát, nóng, lạnh, lo, ngứa, buồn cười, hồi hộp, run, ngại]
    # dấu hiệu ý định thật: có các từ này cùng khoảng thì vẫn báo
    still_if: [chỉ, thật sự, thực sự, rất, đến mức, tới mức, mệt mỏi, cuộc sống, cuộc đời]

  - id: thai_ra_mau
    severity: emergency
    symptom_code: thai_ra_mau
    phrases: [có thai ra máu, mang thai ra máu, đang bầu ra máu, có bầu ra máu]
    # đang mang thai và bị ra máu trong cùng tin nhắn ("mang thai 10 tuần và bị ra máu")
    all_of:
      - {phrases: [có thai, mang thai, thai kỳ, bầu]}
      - {phrases: [ra máu, chảy máu, ra huyết], except: [chảy máu chân răng, chảy máu cam, chảy máu mũi]}

  - id: dau_bung_du_doi
    severity: emergency
    symptom_code: dau_bung_du_doi
    phrases: [đau bụng dữ dội, đau bụng rất dữ dội, bụng đau dữ dội]

  - id: dau_keo_dai
    severity: see_doctor
    symptom_code: dau_keo_dai
    phrases: [đau kéo dài, đau mấy ngày nay, đau nhiều ngày]

  - id: sot_keo_dai
    severity: see_doctor
    symptom_code: sot_keo_dai
    phrases: [sốt kéo dài, sốt mấy ngày]

  - id: sut_can
    severity: see_doctor
    symptom_code: sut_can
    phrases: [sụt cân không rõ lý do, sụt cân nhanh, giảm cân không rõ nguyên nhân, sụt cân không rõ nguyên nhân]

  - id: khoi_u
    severity: see_doctor
    symptom_code: khoi_u
    phrases: [sờ thấy khối u, nổi cục, có khối u]

  - id: ho_keo_dai
    severity: see_doctor
    symptom_code: ho_keo_dai
    phrases: [ho kéo dài, ho mấy tuần]
