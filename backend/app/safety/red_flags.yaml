# Danh sách cờ đỏ CHỈ ĐỂ HỌC, không thay thế quy trình y tế thật. Viết có dấu; code tự chuẩn hóa.
#
# Mỗi luật:
#   phrases: so trên chữ đã bỏ dấu, nên gõ không dấu vẫn bắt được.
#   exact: cụm mà bỏ dấu sẽ trùng câu vô hại ("tự tử"/"từ từ", "ngất"/"ngạt mũi", "xỉu"/"xíu", "nói khó"/"nỗi khổ"),
#     nên phải gõ đúng dấu mới bắt. Gõ không dấu thì để lớp 2 (check_symptoms) bắt.
#   except: cụm vô hại viết có dấu; cụm khớp mà chồng lên cụm này thì bỏ ("nâng ngực" không phải "nặng ngực").
#   not_after: từ viết có dấu; có trong 3 từ ngay trước cụm khớp (cùng vế câu) thì bỏ ("sợ lấy máu muốn chết"),
#     trừ khi khoảng đó cũng có một từ still_if ("mệt mỏi chỉ muốn chết" vẫn báo).
#   all_of: các nhóm (mỗi nhóm có phrases / exact / except) cùng có mặt trong một tin nhắn thì báo.
#
# Từ chức năng dưới đây: tin nhắn có dấu thì so có dấu ("ợ chua" không phải "chưa"), không dấu thì so bỏ dấu.
# Phủ định: bỏ qua triệu chứng nếu ngay trước nó, cách tối đa 2 từ và trong cùng vế câu, có một cụm phủ định.
negations: [không, chưa, chưa từng, không hề, hết, không còn, chưa bao giờ, không bao giờ, không có, không thấy]
# Chỉ dùng khi tin nhắn có dấu: bỏ dấu thì "chả" thành "cha" (bố).
accented_negations: [chẳng, chả]
# Cụm bắt đầu bằng từ phủ định nhưng không phủ định triệu chứng theo sau ("hết sức khó thở").
not_negations: [hết sức, không chỉ, không những, không hiểu sao, không biết sao, chưa kể, không ngờ,
                không thấy đỡ, không đỡ, không khỏi, không giảm]
# Từ nối: phủ định đứng trước từ này không phủ định phần sau ("không đau nhưng khó thở"). Mỗi mục một từ.
connectors: [nhưng, mà, nên, thì]
# Từ liệt kê: phủ định của triệu chứng trước áp cho triệu chứng sau ("không đau ngực hay khó thở"). Mỗi mục một từ.
coordinators: [hay, hoặc, và, với]

rules:
  - id: dau_nguc
    severity: emergency
    symptom_code: dau_nguc
    phrases: [đau ngực, đau thắt ngực, tức ngực, nặng ngực, thắt ngực, ngực đau, đau lồng ngực, tức lồng ngực,
              đau vùng ngực, đau ở ngực, đau giữa ngực, đau bên ngực, nhói ngực, đè nặng ngực, ngực bị đè, nhói tim,
              lên cơn đau tim]
    # không có "đau tim" đơn lẻ: "gói này có phát hiện bệnh đau tim không?" là câu hỏi, không phải triệu chứng
    except: [nâng ngực]

  - id: kho_tho
    severity: emergency
    symptom_code: kho_tho
    phrases: [khó thở, thở dốc, hụt hơi, ngạt thở, không thở được, thở không được, thở không nổi, không thở nổi,
              thở không ra hơi, khó hít thở, thở khó, nghẹt thở]
    # không có "thở gấp", "thở hổn hển": hay đi sau gắng sức ("leo cầu thang thở gấp"); để lớp 2 xét

  - id: dot_quy
    severity: emergency
    symptom_code: dot_quy
    # không có "đột quỵ", "tai biến": hay là tiền sử ("bố tôi từng bị đột quỵ") hoặc tên gói tầm soát
    phrases: [yếu nửa người, liệt nửa người, tê nửa người, méo miệng, nói ngọng đột ngột, méo mồm, miệng méo,
              miệng bị méo, mồm méo, yếu một bên, tê một bên, liệt một bên, tê nửa mặt, liệt nửa mặt, đớ lưỡi,
              đột nhiên nói ngọng, tự nhiên nói ngọng]
    exact: [nói đớ]  # bỏ dấu thì trùng "nói đó"
    any_of:
      - exact: [nói khó]  # bỏ dấu thì trùng "nỗi khổ"
        # người dùng chê câu trả lời khó hiểu. Không loại "em nói khó": "em" còn là "của tôi" ("bố em nói khó"),
        # nên "em nói khó hiểu quá" vẫn bị báo; cố ý chấp nhận báo nhầm để không bỏ sót đột quỵ
        except: [bạn nói khó]
        not_after: [nghe, bảo, bác sĩ, người ta, họ]  # "nghe nói khó đặt lịch", "bác sĩ nói khó lắm"

  - id: ngat
    severity: emergency
    symptom_code: ngat
    phrases: [bất tỉnh, ngất xỉu, lịm đi, mất ý thức, mất tri giác]
    # bỏ dấu thì trùng "ngạt", "xíu", "hơn mẹ", "gói không tính", "mẹ mặn"
    exact: [ngất, xỉu, hôn mê, gọi không tỉnh, gọi không dậy, mê man]
    except: [ngất ngưởng, ngất trời, ngất ngây]

  - id: co_giat
    severity: emergency
    symptom_code: co_giat
    phrases: [co giật, sùi bọt mép, lên cơn giật]
    except: [có giật]  # "đo điện tim có giật không?"

  - id: xuat_huyet
    severity: emergency
    symptom_code: xuat_huyet
    phrases: [ho ra máu, nôn ra máu, đi ngoài ra máu, đi cầu ra máu, đại tiện ra máu, đi tiêu ra máu, ói ra máu,
              khạc ra máu, chảy máu không cầm, chảy máu không ngừng, máu chảy không cầm, máu chảy không ngừng]
    exact: [phân có máu]  # bỏ dấu thì trùng "phần có màu"

  - id: sot_cung_co
    severity: emergency
    symptom_code: sot_cung_co
    phrases: [sốt cao co giật, sốt cao kèm cứng cổ, sốt cao cứng cổ]
    # spec: sốt cao kèm cứng cổ; cứng cổ đơn lẻ (ngồi máy tính nhiều) không phải cấp cứu.
    # "sốt" để exact vì bỏ dấu trùng "sót" ("bỏ sót"); nhóm cứng cổ vốn đã exact nên không mất gì khi gõ không dấu
    all_of:
      - {exact: [sốt]}
      - {exact: [cứng cổ, cứng gáy]}

  - id: tu_tu
    severity: emergency
    symptom_code: tu_tu
    # không có "kết thúc cuộc sống/cuộc đời": "kết thúc cuộc sống độc thân" (khám tiền hôn nhân)
    phrases: [tự sát, không muốn sống, không còn muốn sống, chẳng muốn sống, chẳng còn muốn sống, chán sống,
              không thiết sống, không muốn tồn tại, ý định tự tử, nghĩ đến tự tử, nghĩ tới tự tử, quyên sinh,
              kết liễu, tìm đến cái chết, chết cho xong, chết quách, tự làm hại bản thân, tự làm hại mình,
              tự làm đau bản thân, rạch tay]
    exact: [tự tử, tự vẫn]  # bỏ dấu thì trùng "từ từ", "tư vấn"
    except: [chán sống độc thân]
    any_of:
      # chỉ "muốn chết" mới hay là nói quá; "mệt không muốn sống", "lo quá muốn tự tử" thì luôn báo
      - phrases: [muốn chết]
        # nói quá: "sợ lấy máu muốn chết", "nóng muốn chết". Không gồm "buồn", "chán", "đau" vì có thể là thật.
        # shortcut: gõ không dấu thì vẫn báo cả câu nói quá; cố ý chấp nhận để an toàn
        not_after: [sợ, mệt, đói, khát, nóng, lạnh, lo, ngứa, buồn cười, hồi hộp, run, ngại]
        # dấu hiệu ý định thật: có các từ này cùng khoảng thì vẫn báo
        still_if: [chỉ, thật sự, thực sự, rất, đến mức, tới mức, mệt mỏi, cuộc sống, cuộc đời]

  - id: thai_ra_mau
    severity: emergency
    symptom_code: thai_ra_mau
    phrases: [có thai ra máu, mang thai ra máu, đang bầu ra máu, có bầu ra máu]
    # đang mang thai và bị ra máu trong cùng tin nhắn ("mang thai 10 tuần và bị ra máu").
    # "thai" để exact vì bỏ dấu trùng "Thái" (Thái Bình, Thái Nguyên)
    all_of:
      - {phrases: [có thai, mang thai, thai kỳ, bầu], exact: [thai]}
      - {phrases: [ra máu, chảy máu, ra huyết, rỉ máu], except: [chảy máu chân răng, chảy máu cam, chảy máu mũi]}

  - id: dau_bung_du_doi
    severity: emergency
    symptom_code: dau_bung_du_doi
    phrases: [đau bụng dữ dội, đau bụng rất dữ dội, bụng đau dữ dội, đau bụng quằn quại, bụng đau quằn quại,
              đau bụng không chịu nổi, đau bụng không chịu được, đau bụng lăn lộn]

  # Ba luật "kéo dài": chỗ đau, sốt, ho thường đứng giữa ("đau lưng mấy tuần nay"), nên ngoài cụm liền còn bắt
  # khi tin nhắn vừa có triệu chứng vừa có từ chỉ thời gian. "đau", "sốt", "ho" để exact vì bỏ dấu trùng
  # "đâu", "sót", "họ"; gõ không dấu thì chỉ bắt cụm liền. Báo nhầm chỉ thêm lời khuyên đi khám, chấp nhận được.
  - id: dau_keo_dai
    severity: see_doctor
    symptom_code: dau_keo_dai
    phrases: [đau kéo dài, đau mấy ngày nay, đau nhiều ngày]
    all_of:
      - {exact: [đau, nhức]}
      - &keo_dai
        phrases: [kéo dài, mấy ngày nay, mấy hôm nay, mấy tuần nay, cả tuần nay, mấy tháng nay, cả tháng nay,
                  lâu ngày, mãi không khỏi, mãi không hết, hoài không hết, hoài không khỏi]
        except: [kéo dài bao lâu, kéo dài mấy, có kéo dài]  # hỏi về buổi khám: "khám kéo dài bao lâu?"

  - id: sot_keo_dai
    severity: see_doctor
    symptom_code: sot_keo_dai
    phrases: [sốt kéo dài, sốt mấy ngày]
    all_of:
      - {exact: [sốt]}
      - *keo_dai

  - id: sut_can
    severity: see_doctor
    symptom_code: sut_can
    # "giảm cân" đơn lẻ thường là mong muốn ("muốn giảm cân"), nên chỉ bắt khi liền "không rõ", "tự nhiên".
    # shortcut: "Tự nhiên tôi giảm cân" không bắt được (có chữ chen giữa); để lớp 2 xét
    phrases: [sụt cân, sút cân, sụt ký, sụt kí, gầy sút, giảm cân không rõ, tự nhiên giảm cân, tự dưng giảm cân]

  - id: khoi_u
    severity: see_doctor
    symptom_code: khoi_u
    # không có "khối u" đơn lẻ: "tầm soát khối u", "từng mổ khối u" là câu hỏi hoặc tiền sử
    phrases: [sờ thấy khối u, có khối u, bị khối u, mọc khối u, cục u, nổi u, nổi cục, sờ thấy cục, nổi hạch,
              sưng hạch, nổi bướu, có bướu]
    exact: [có cục, có hạch]  # bỏ dấu thì trùng "có cực" ("có cực kỳ nhiều")

  - id: ho_keo_dai
    severity: see_doctor
    symptom_code: ho_keo_dai
    phrases: [ho kéo dài, ho mấy tuần]
    all_of:
      - {exact: [ho]}
      - *keo_dai
